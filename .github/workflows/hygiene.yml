name: hygiene and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No third-party data in the repository
        run: python scripts/check_hygiene.py
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
